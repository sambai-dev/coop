# Merge this block into ~/.hermes/config.yaml. Put the real values in
# ~/.hermes/.env as ROOKHOLD_BASE_URL and ROOKHOLD_API_KEY; do not commit them here.
mcp_servers:
  rookhold:
    command: "rookhold-mcp"
    args: []
    env:
      ROOKHOLD_BASE_URL: "${ROOKHOLD_BASE_URL}"
      ROOKHOLD_API_KEY: "${ROOKHOLD_API_KEY}"
      ROOKHOLD_MCP_MINIMUM_ISOLATION: "${ROOKHOLD_MCP_MINIMUM_ISOLATION}"
      ROOKHOLD_MCP_ALLOWED_LANGUAGES: "${ROOKHOLD_MCP_ALLOWED_LANGUAGES}"
    enabled: true
    timeout: 330
    connect_timeout: 30
    supports_parallel_tool_calls: false
    tools:
      include:
        - rookhold_run_code
        - rookhold_job_result
        - rookhold_job_events
        - rookhold_cancel_job
      resources: false
      prompts: false
