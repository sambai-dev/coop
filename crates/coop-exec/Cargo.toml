[package]
name = "coop-exec"
autobins = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Policy-bound execution backends for the Rookhold execution gateway"
readme = "../../README.md"

[[bin]]
name = "rookhold-sandbox-init"
path = "src/bin/rookhold-sandbox-init.rs"

[[bin]]
name = "coop-sandbox-init"
path = "src/bin/coop-sandbox-init.rs"

[[bin]]
name = "rookhold-oci-init"
path = "src/bin/rookhold-oci-init.rs"

[[bin]]
name = "coop-oci-init"
path = "src/bin/coop-oci-init.rs"

[dependencies]
coop-types = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", features = ["sched", "mount", "signal", "process", "user", "resource", "fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
