[package]
name = "coop-exec"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Execution backends for Coop: naive subprocess and Linux namespace/cgroup sandbox"

[dependencies]
coop-types = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", features = ["sched", "mount", "signal", "process", "user", "resource", "fs"] }
