[package]
name = "coop-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Coop: a self-hosted, audit-first execution gateway for AI agents"
readme = "../../README.md"
default-run = "coop"

[[bin]]
name = "coop"
path = "src/main.rs"

[dependencies]
coop-types = { workspace = true }
coop-store = { workspace = true }
coop-exec = { workspace = true }
coop-attestation = { workspace = true }
axum = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
utoipa = { workspace = true }
uuid = { workspace = true }
futures-util = { workspace = true }
dashmap = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
subtle = { workspace = true }
zeroize = { workspace = true }
base64 = { workspace = true }
jsonwebtoken = { workspace = true }
reqwest = { workspace = true }

[dev-dependencies]
jsonwebtoken = { workspace = true, features = ["use_pem"] }
