name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  ROOKHOLD_GIT_REVISION: ${{ github.sha }}
  RUST_BACKTRACE: "1"

jobs:
  preflight:
    name: release preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require configured repository release governance
        env:
          RELEASE_GOVERNANCE: ${{ vars.ROOKHOLD_RELEASE_GOVERNANCE }}
        shell: bash
        run: |
          if [ "$RELEASE_GOVERNANCE" != enabled ]; then
            echo "Configure the protected release environment/tag rules described in docs/releasing.md, then set ROOKHOLD_RELEASE_GOVERNANCE=enabled" >&2
            exit 1
          fi
      - name: Require a concrete build revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ROOKHOLD_GIT_REVISION" =~ ^[0-9a-f]{40}$ ]]
          checkout_revision=$(git rev-parse --verify 'HEAD^{commit}')
          test "$ROOKHOLD_GIT_REVISION" = "$checkout_revision"
      - name: Verify tag equals workspace version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(awk -F'"' '/^version = "/ { print $2; exit }' Cargo.toml)
          tag=${GITHUB_REF_NAME#v}
          test -n "$version"
          test "$tag" = "$version"
          grep -q "^## ${version}" CHANGELOG.md
          if grep -Eqi "^## ${version}.*unreleased" CHANGELOG.md; then
            echo "CHANGELOG.md still marks ${version} as unreleased" >&2
            exit 1
          fi
          grep -Fq "[v${version}](https://github.com/sambai-dev/rookhold/releases/tag/v${version})" README.md
          series="${version%.*}.x"
          grep -Fq "| tagged \`${series}\` releases | Supported |" SECURITY.md
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Validate release surface
        run: python3 scripts/check-release-surface.py
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace --all-targets
      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit locked dependencies
        run: cargo audit --deny warnings

  sdk-gate:
    name: SDK release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: preflight
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json
      - name: Install Python SDK and pinned development checks
        run: >-
          python -m pip install "./sdks/python[dev]"
          build==1.3.0 twine==7.0.0
      - name: Run Python SDK tests
        run: python -m unittest discover -s sdks/python/tests -v
      - name: Lint and format-check Python SDK
        working-directory: sdks/python
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Type-check Python SDK with Pyright
        working-directory: sdks/python
        run: python -m pyright
      - name: Type-check Python SDK with Mypy
        working-directory: sdks/python
        run: python -m mypy --strict rookhold.py rookhold_cli.py rookhold_mcp.py coop.py coop_mcp.py tests/typecheck_usage.py
      - working-directory: sdks/typescript
        run: npm ci
      - working-directory: sdks/typescript
        run: npm test
      - working-directory: sdks/typescript
        run: npm run typecheck
      - name: Build and verify Python wheel and source distribution
        shell: bash
        run: |
          set -euo pipefail
          rm -rf sdk-dist
          python -m build --wheel --sdist --outdir sdk-dist ./sdks/python
          wheel=$(find sdk-dist -maxdepth 1 -type f -name 'rookhold_sdk-*.whl')
          sdist=$(find sdk-dist -maxdepth 1 -type f -name 'rookhold_sdk-*.tar.gz')
          test "$(printf '%s\n' "$wheel" | grep -c .)" -eq 1
          test "$(printf '%s\n' "$sdist" | grep -c .)" -eq 1
          python -m twine check "$wheel" "$sdist"
          for kind in wheel sdist; do
            artifact=$wheel
            if [ "$kind" = sdist ]; then artifact=$sdist; fi
            target="sdks/python/.verify-dist/${kind}-install"
            rm -rf "$target"
            python -m pip install --no-deps --target "$target" "$artifact"
            PYTHONPATH="$target" python -S -c "from pathlib import Path; import coop, coop_mcp, rookhold, rookhold_cli, rookhold_mcp; assert rookhold.__version__ == '0.7.1'; assert rookhold_mcp.__version__ == rookhold.__version__; assert coop.Coop is rookhold.Rookhold; assert coop_mcp.CoopMcpServer is rookhold_mcp.RookholdMcpServer; assert callable(rookhold_cli.main); assert Path(rookhold.__file__).with_name('py.typed').is_file(); assert Path(coop.__file__).with_name('py.typed').is_file()"
            PYTHONPATH="$target" python -S -m unittest discover -s sdks/python/tests -v
          done
      - name: Build npm package tarball
        working-directory: sdks/typescript
        run: npm pack --pack-destination ../../sdk-dist
      - name: Set up Python compatibility floor
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.9"
      - name: Verify Python 3.9 SDK and development tools
        run: |
          python -m pip install "./sdks/python[dev]"
          python -m unittest discover -s sdks/python/tests -v
          python -m mypy --strict sdks/python/rookhold.py sdks/python/rookhold_cli.py sdks/python/rookhold_mcp.py sdks/python/coop.py sdks/python/coop_mcp.py sdks/python/tests/typecheck_usage.py
      - name: Set up latest supported Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Verify Python 3.14 SDK
        run: |
          python -m pip install "./sdks/python[dev]"
          python -m unittest discover -s sdks/python/tests -v
      - name: Upload SDK packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rookhold-sdks
          path: sdk-dist/*
          if-no-files-found: error
          retention-days: 7

  container-gate:
    name: container release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: preflight
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build locked image
        run: >-
          docker build --pull
          --build-arg "VERSION=${{ needs.preflight.outputs.version }}"
          --build-arg "VCS_REF=${GITHUB_SHA}"
          --tag rookhold:release-candidate .
      - name: Inspect private rootfs
        run: |
          docker run --rm --entrypoint /bin/sh rookhold:release-candidate -ec '
            test -x /usr/local/bin/rookhold
            test -x /usr/local/bin/coop
            test -x /usr/local/bin/rookhold-sandbox-init
            test -x /usr/local/bin/coop-sandbox-init
            test -x /usr/local/bin/rookhold-verify
            test -x /usr/local/bin/coop-verify
            test -x /usr/local/bin/rookhold-container-entrypoint
            test -x /usr/local/bin/coop-container-entrypoint
            test -x /opt/rookhold/rootfs/usr/bin/python3
            test -x /opt/rookhold/rootfs/usr/bin/node
            test -x /opt/rookhold/rootfs/usr/bin/bash
            test -x /opt/rookhold/rootfs/usr/local/bin/rookhold-oci-init
            test -x /opt/rookhold/rootfs/usr/local/bin/coop-oci-init
            test "$(stat -c %a /opt/rookhold)" = 700
            test "$(stat -c %U:%G /opt/rookhold)" = root:root
            test "$(stat -c %a /opt/rookhold/rootfs)" = 755
            test "$(stat -c %U:%G /opt/rookhold/rootfs)" = root:root
            test "$(stat -c %a /data)" = 700
            test "$(stat -c %U:%G /data)" = root:root
            test "$(stat -c %a /var/lib/rookhold/jobs)" = 700
            test "$(stat -c %U:%G /var/lib/rookhold/jobs)" = root:root
            test "$(stat -c %a /run/rookhold-bootstrap)" = 700
            test "$(stat -c %U:%G /run/rookhold-bootstrap)" = root:root
            test "$(stat -c %a /run/rookhold-runtime)" = 700
            test "$(stat -c %U:%G /run/rookhold-runtime)" = root:root
            test "$(stat -c %a /run/rookhold-secrets)" = 700
            test "$(stat -c %U:%G /run/rookhold-secrets)" = root:root
          '
      - name: Smoke final image through the namespace backend
        env:
          ROOKHOLD_SMOKE_ALLOW_PRIVILEGED: "true"
        run: bash scripts/smoke-container.sh rookhold:release-candidate
      - name: Smoke final image through the reviewed gVisor OCI backend
        run: |
          set -euo pipefail
          base=https://storage.googleapis.com/gvisor/releases/release/20260817.0/x86_64
          curl -fsSLo /tmp/rookhold-runsc "$base/runsc"
          curl -fsSLo /tmp/runsc.sha512 "$base/runsc.sha512"
          (cd /tmp && cp rookhold-runsc runsc && sha512sum -c runsc.sha512)
          test "$(sha256sum /tmp/rookhold-runsc | awk '{print $1}')" = 048b89aada69dc3333422e139d6e9d02f8ab06bda52398060e0fbdacca00074c
          sudo install -o root -g root -m 0755 /tmp/rookhold-runsc /usr/local/bin/rookhold-runsc-release
          docker run --rm --privileged --cgroupns=host \
            --volume /usr/local/bin/rookhold-runsc-release:/usr/local/bin/runsc:ro \
            --volume "$PWD/scripts/smoke-gvisor.sh:/usr/local/bin/smoke-gvisor.sh:ro" \
            --env ROOKHOLD_GVISOR_RUNSC=/usr/local/bin/runsc \
            --env ROOKHOLD_GVISOR_SERVER_BIN=/usr/local/bin/rookhold \
            --entrypoint /bin/bash \
            rookhold:release-candidate /usr/local/bin/smoke-gvisor.sh

  hostile:
    name: containment release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: preflight
    container:
      image: rust:1.98.0-slim-bookworm@sha256:af0579d28b9a7ec5251aaafcb0c0a23dcde5c97065112aae0cc3abeda42d5394
      options: --privileged --cgroupns=host
    env:
      CARGO_HOME: /usr/local/cargo
      DEBIAN_SNAPSHOT: 20260826T000000Z
      RUST_LOG: info,coop_server=debug
      ROOKHOLD_ROOTFS: /opt/rookhold/rootfs
      ROOKHOLD_SANDBOX_HELPER: /usr/local/bin/rookhold-sandbox-init
    steps:
      - name: Install test runtimes and preflight tools
        shell: bash
        run: |
          set -euo pipefail
          rm -f /etc/apt/sources.list.d/debian.sources
          printf '%s\n' \
            "deb [check-valid-until=no] http://snapshot.debian.org/archive/debian/${DEBIAN_SNAPSHOT}/ bookworm main" \
            "deb [check-valid-until=no] http://snapshot.debian.org/archive/debian/${DEBIAN_SNAPSHOT}/ bookworm-updates main" \
            "deb [check-valid-until=no] http://snapshot.debian.org/archive/debian-security/${DEBIAN_SNAPSHOT}/ bookworm-security main" \
            > /etc/apt/sources.list
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git python3 nodejs bash ca-certificates curl util-linux
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build helper and private test rootfs
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p coop-server --bin rookhold -p coop-exec --bin rookhold-sandbox-init --bin rookhold-oci-init -p coop-attestation --bin rookhold-verify
          bash scripts/prepare-test-rootfs.sh target/debug/rookhold-sandbox-init target/debug/rookhold-oci-init
      - name: Install reviewed gVisor runtime
        shell: bash
        run: |
          set -euo pipefail
          base=https://storage.googleapis.com/gvisor/releases/release/20260817.0/x86_64
          curl -fsSLo /usr/local/bin/runsc "$base/runsc"
          curl -fsSLo /tmp/runsc.sha512 "$base/runsc.sha512"
          (cd /usr/local/bin && sha512sum -c /tmp/runsc.sha512)
          test "$(sha256sum /usr/local/bin/runsc | awk '{print $1}')" = 048b89aada69dc3333422e139d6e9d02f8ab06bda52398060e0fbdacca00074c
          chmod 0755 /usr/local/bin/runsc
          test "$(/usr/local/bin/runsc --version | head -n1)" = "runsc version release-20260817.0"
      - name: Run real gVisor OCI lifecycle and crash-reconciliation gate
        shell: bash
        env:
          ROOKHOLD_GVISOR_RUNSC: /usr/local/bin/runsc
          ROOKHOLD_GVISOR_SERVER_BIN: target/debug/rookhold
        run: bash scripts/smoke-gvisor.sh
      - name: Fail if containment prerequisites are unavailable
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test "$(id -u)" = 0
          test -r /sys/fs/cgroup/cgroup.controllers
          controllers=$(cat /sys/fs/cgroup/cgroup.controllers)
          test -n "$controllers"
          grep -qw memory <<<"$controllers"
          grep -qw pids <<<"$controllers"
          grep -qw cpu <<<"$controllers"
          actual_kernel=$(uname -r | cut -d- -f1)
          test "$(printf '%s\n' 5.14 "$actual_kernel" | sort -V | head -n1)" = 5.14
          probe="/sys/fs/cgroup/rookhold-release-preflight-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir "$probe"
          test -w "$probe/cgroup.kill"
          echo 1 > "$probe/cgroup.kill"
          echo max > "$probe/memory.max"
          echo max > "$probe/pids.max"
          echo "max 100000" > "$probe/cpu.max"
          rmdir "$probe"
          unshare --mount --pid --fork /bin/true
      - name: Guard hostile test discovery and run without skips
        shell: bash
        run: |
          set -euo pipefail
          count=$(cargo test --locked -p coop-server --test hostile -- --list --ignored | grep -c ': test$')
          echo "discovered ${count} hostile tests"
          test "$count" -eq 18
          (
            umask 0077
            cargo test --locked -p coop-exec --test namespace_umask restrictive_umask_preserves_private_device_access -- --exact --ignored --nocapture
          )
          cargo test --locked -p coop-server --test hostile -- --ignored --nocapture 2>&1 | tee hostile.log
          if grep -q 'SKIP:' hostile.log; then
            echo 'containment suite skipped a prerequisite'
            exit 1
          fi

  build:
    name: build ${{ matrix.target }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            binary: rookhold
            archive: tar.gz
            cli_asset: rookhold-cli-x86_64-unknown-linux-musl
          - target: aarch64-apple-darwin
            os: macos-15
            binary: rookhold
            archive: tar.gz
            cli_asset: rookhold-cli-aarch64-apple-darwin
          - target: x86_64-pc-windows-msvc
            os: windows-2025
            binary: rookhold.exe
            archive: zip
            cli_asset: rookhold-cli-x86_64-pc-windows-msvc.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python for standalone terminal apps
        if: matrix.target != 'x86_64-unknown-linux-musl'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.target }}
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Install pinned standalone app builder
        if: matrix.target != 'x86_64-unknown-linux-musl'
        run: >-
          python -m pip install --disable-pip-version-check
          pyinstaller==6.22.2 pyinstaller-hooks-contrib==2026.7
      - name: Build standalone CLI and MCP apps
        if: matrix.target != 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          set -euo pipefail
          python -m PyInstaller --noconfirm --clean --onefile \
            --name rookhold-cli --paths sdks/python \
            --distpath standalone-dist --workpath standalone-build/cli \
            --specpath standalone-spec sdks/python/rookhold_cli.py
          python -m PyInstaller --noconfirm --clean --onefile \
            --name rookhold-mcp --paths sdks/python \
            --distpath standalone-dist --workpath standalone-build/mcp \
            --specpath standalone-spec sdks/python/rookhold_mcp.py
      - name: Build musl-native standalone CLI and MCP apps
        if: matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 \
            --volume "$PWD:/src" --workdir /src \
            python:3.12-alpine@sha256:285a71327884a4d50efbea30104473b0fa43ecefa499458899670ca30dae76e5 \
            sh -ec '
              apk add --no-cache binutils
              python -m pip install --disable-pip-version-check pyinstaller==6.22.2 pyinstaller-hooks-contrib==2026.7
              python -m PyInstaller --noconfirm --clean --onefile \
                --name rookhold-cli --paths sdks/python \
                --distpath standalone-dist --workpath standalone-build/cli \
                --specpath standalone-spec sdks/python/rookhold_cli.py
              python -m PyInstaller --noconfirm --clean --onefile \
                --name rookhold-mcp --paths sdks/python \
                --distpath standalone-dist --workpath standalone-build/mcp \
                --specpath standalone-spec sdks/python/rookhold_mcp.py
            '
      - name: Smoke standalone terminal apps without Python packaging
        shell: bash
        run: |
          set -euo pipefail
          suffix=
          python_cmd=python
          if [ "$RUNNER_OS" = Windows ]; then suffix=.exe; fi
          if [ "$RUNNER_OS" = Linux ]; then python_cmd=python3; fi
          test "$("standalone-dist/rookhold-cli${suffix}" --version)" = "rookhold-cli ${{ needs.preflight.outputs.version }}"
          test "$("standalone-dist/rookhold-mcp${suffix}" --version)" = "rookhold-mcp ${{ needs.preflight.outputs.version }}"
          response=$(printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25"}}' | \
            ROOKHOLD_API_KEY=standalone-smoke "standalone-dist/rookhold-cli${suffix}" mcp-server)
          MCP_RESPONSE="$response" "$python_cmd" -c \
            'import json, os; value=json.loads(os.environ["MCP_RESPONSE"]); assert value["id"] == 1 and "result" in value'
      - name: Stage the direct single-file CLI download
        shell: bash
        run: |
          set -euo pipefail
          suffix=
          if [ "$RUNNER_OS" = Windows ]; then suffix=.exe; fi
          cp "standalone-dist/rookhold-cli${suffix}" "${{ matrix.cli_asset }}"
      - name: Build locked release binary
        run: cargo build --locked --release -p coop-server -p coop-exec -p coop-attestation --bins --target ${{ matrix.target }}
      - name: Validate release target
        shell: bash
        run: |
          set -euo pipefail
          target='${{ matrix.target }}'
          host=$(rustc -vV | awk '/^host:/ { print $2 }')
          if [ "$target" = x86_64-unknown-linux-musl ] || [ "$target" = "$host" ]; then
            cargo test --locked --workspace --all-targets --target "$target"
          else
            # Any future cross-built target is type-checked here; its native
            # host behavior must also remain gated by the normal CI matrix.
            cargo check --locked --workspace --all-targets --target "$target"
          fi
      - name: Package Unix artifact
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          dir="rookhold-${{ matrix.target }}"
          mkdir "$dir"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$dir/"
          cp standalone-dist/rookhold-cli standalone-dist/rookhold-mcp "$dir/"
          cp "target/${{ matrix.target }}/release/rookhold-verify" "$dir/"
          cp "target/${{ matrix.target }}/release/coop" "$dir/"
          cp "target/${{ matrix.target }}/release/coop-verify" "$dir/"
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-musl" ]; then
            cp "target/${{ matrix.target }}/release/rookhold-sandbox-init" "$dir/"
            cp "target/${{ matrix.target }}/release/rookhold-oci-init" "$dir/"
            cp "target/${{ matrix.target }}/release/coop-sandbox-init" "$dir/"
            cp "target/${{ matrix.target }}/release/coop-oci-init" "$dir/"
          fi
          cp README.md LICENSE SECURITY.md AUDIT.md CHANGELOG.md "$dir/"
          cp docs/standalone-cli.md "$dir/QUICKSTART.md"
          cp -R docs deploy sdks integrations "$dir/"
          mkdir "$dir/scripts"
          cp scripts/build-rootfs-manifest.py scripts/smoke-gvisor.sh "$dir/scripts/"
          tar -czf "${dir}.tar.gz" "$dir"
      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "rookhold-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $dir | Out-Null
          Copy-Item -LiteralPath "target/${{ matrix.target }}/release/${{ matrix.binary }}" -Destination $dir
          Copy-Item -LiteralPath standalone-dist/rookhold-cli.exe, standalone-dist/rookhold-mcp.exe -Destination $dir
          Copy-Item -LiteralPath "target/${{ matrix.target }}/release/rookhold-verify.exe" -Destination $dir
          Copy-Item -LiteralPath "target/${{ matrix.target }}/release/coop.exe" -Destination $dir
          Copy-Item -LiteralPath "target/${{ matrix.target }}/release/coop-verify.exe" -Destination $dir
          Copy-Item -LiteralPath README.md, LICENSE, SECURITY.md, AUDIT.md, CHANGELOG.md -Destination $dir
          Copy-Item -LiteralPath docs/standalone-cli.md -Destination "$dir/QUICKSTART.md"
          Copy-Item -LiteralPath docs, deploy, sdks, integrations -Destination $dir -Recurse
          Compress-Archive -Path $dir -DestinationPath "${dir}.zip"
      - name: Upload packaged artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rookhold-${{ matrix.target }}
          path: |
            rookhold-${{ matrix.target }}.${{ matrix.archive }}
            ${{ matrix.cli_asset }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish release atomically
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [preflight, sdk-gate, container-gate, hostile, build]
    environment:
      name: release
      url: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download SDK packages by exact artifact name
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rookhold-sdks
          path: artifact-downloads/rookhold-sdks
      - name: Download Linux package by exact artifact name
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rookhold-x86_64-unknown-linux-musl
          path: artifact-downloads/rookhold-x86_64-unknown-linux-musl
      - name: Download macOS package by exact artifact name
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rookhold-aarch64-apple-darwin
          path: artifact-downloads/rookhold-aarch64-apple-darwin
      - name: Download Windows package by exact artifact name
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rookhold-x86_64-pc-windows-msvc
          path: artifact-downloads/rookhold-x86_64-pc-windows-msvc
      - name: Assemble the exact nine-payload release set
        shell: bash
        run: >-
          python3 scripts/release-artifacts.py assemble
          --downloads artifact-downloads
          --dist dist
          --version "${{ needs.preflight.outputs.version }}"
      - name: Freshly extract and inventory every release payload
        shell: bash
        run: >-
          python3 scripts/release-artifacts.py prepare
          --dist dist
          --output sbom-input
          --checksums "${RUNNER_TEMP}/rookhold-payload-subjects.sha256"
          --version "${{ needs.preflight.outputs.version }}"
      - name: Generate combined artifact-scoped SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        env:
          SYFT_CHECK_FOR_APP_UPDATE: "false"
          SYFT_FILE_METADATA_SELECTION: all
          SYFT_SOURCE_NAME: rookhold-release-${{ needs.preflight.outputs.version }}
          SYFT_SOURCE_VERSION: ${{ needs.preflight.outputs.version }}
        with:
          path: sbom-input
          format: spdx-json
          output-file: dist/rookhold-${{ needs.preflight.outputs.version }}.spdx.json
          syft-version: v1.51.1
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false
      - name: Validate the artifact-scoped SPDX
        shell: bash
        run: >-
          python3 scripts/release-artifacts.py verify-sbom
          --sbom "dist/rookhold-${{ needs.preflight.outputs.version }}.spdx.json"
          --version "${{ needs.preflight.outputs.version }}"
      - name: Bind the SPDX SBOM to all nine payload digests
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/rookhold-payload-subjects.sha256
          sbom-path: dist/rookhold-${{ needs.preflight.outputs.version }}.spdx.json
      - name: Finalize and checksum the exact eleven-asset contract
        shell: bash
        run: >-
          python3 scripts/release-artifacts.py finalize
          --dist dist
          --attestation-checksums "${RUNNER_TEMP}/rookhold-release-subjects.sha256"
          --version "${{ needs.preflight.outputs.version }}"
      - name: Attest exact release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/rookhold-release-subjects.sha256
      - name: Verify generated SBOM and provenance attestations
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          common=(
            --repo "$GITHUB_REPOSITORY"
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
            --source-ref "$GITHUB_REF"
            --source-digest "$GITHUB_SHA"
            --signer-digest "$GITHUB_WORKFLOW_SHA"
            --deny-self-hosted-runners
          )
          while read -r _ asset; do
            gh attestation verify "dist/$asset" "${common[@]}" \
              --predicate-type https://spdx.dev/Document/v2.3 >/dev/null
          done < "${RUNNER_TEMP}/rookhold-payload-subjects.sha256"
          while read -r _ asset; do
            gh attestation verify "dist/$asset" "${common[@]}" \
              --predicate-type https://slsa.dev/provenance/v1 >/dev/null
          done < "${RUNNER_TEMP}/rookhold-release-subjects.sha256"
      - name: Stage the complete artifact set in a draft release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/rookhold-x86_64-unknown-linux-musl.tar.gz
            dist/rookhold-aarch64-apple-darwin.tar.gz
            dist/rookhold-x86_64-pc-windows-msvc.zip
            dist/rookhold-cli-x86_64-unknown-linux-musl
            dist/rookhold-cli-aarch64-apple-darwin
            dist/rookhold-cli-x86_64-pc-windows-msvc.exe
            dist/rookhold_sdk-${{ needs.preflight.outputs.version }}-py3-none-any.whl
            dist/rookhold_sdk-${{ needs.preflight.outputs.version }}.tar.gz
            dist/rookhold-sdk-${{ needs.preflight.outputs.version }}.tgz
            dist/rookhold-${{ needs.preflight.outputs.version }}.spdx.json
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          overwrite_files: false
          generate_release_notes: true
          draft: true
      - name: Reconcile the remote draft before publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          metadata="${RUNNER_TEMP}/rookhold-draft-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --json assets,isDraft,tagName > "$metadata"
          python3 scripts/release-artifacts.py verify-release \
            --dist dist \
            --metadata "$metadata" \
            --version "${{ needs.preflight.outputs.version }}" \
            --tag "$GITHUB_REF_NAME"
      - name: Publish the fully staged release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest --verify-tag
