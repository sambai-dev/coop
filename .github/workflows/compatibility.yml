name: compatibility

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: false

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ./sdks/python
      - run: python -m unittest discover -s sdks/python/tests -v

  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
        working-directory: sdks/typescript
      - run: npm test
        working-directory: sdks/typescript

  local-run:
    name: local run on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --locked -p coop-server --bin rookhold
      - name: Run the one-command trusted local example
        shell: bash
        run: |
          suffix=
          if [ "$RUNNER_OS" = Windows ]; then suffix=.exe; fi
          "target/debug/rookhold${suffix}" run python 'print(6 * 7)' --json | \
            python -c 'import json, sys; value=json.load(sys.stdin); assert value["result"]["stdout"] == "42" and value["result"]["status"] == "succeeded"'

  examples-and-mcp:
    name: recipes and MCP configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: 1.98.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: cargo build --locked -p coop-server --bin rookhold
      - run: python -m pip install ./sdks/python
      - name: Start trusted local service
        shell: bash
        run: |
          target/debug/rookhold dev >rookhold.log 2>&1 &
          echo $! > rookhold.pid
          for attempt in {1..100}; do
            curl -fsS http://127.0.0.1:7300/readyz >/dev/null && exit 0
            sleep .1
          done
          cat rookhold.log
          exit 1
      - name: Run the copyable Python recipes
        env:
          ROOKHOLD_BASE_URL: http://127.0.0.1:7300
          ROOKHOLD_API_KEY: rookhold-dev-key
        run: |
          python examples/python-basic/hello.py
          python examples/json-transform/transform.py
          python examples/evaluator/evaluate.py
          python examples/stdin-json/process.py
          python examples/timeout-and-cancel/timeout.py
      - name: Check maintained MCP host files and initialize the adapter
        env:
          ROOKHOLD_BASE_URL: http://127.0.0.1:7300
          ROOKHOLD_API_KEY: rookhold-dev-key
        shell: bash
        run: |
          python -m json.tool integrations/claude-code/mcp.json >/dev/null
          python -m json.tool integrations/opencode/opencode.snippet.json >/dev/null
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25"}}' | rookhold-cli mcp-server | python -c 'import json, sys; value=json.load(sys.stdin); assert "result" in value'
      - name: Stop local service
        if: always()
        shell: bash
        run: kill "$(cat rookhold.pid)" 2>/dev/null || true

  dashboard-browser:
    name: dashboard in stable Chrome
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --locked -p coop-server --bin rookhold
      - name: Start trusted local service
        shell: bash
        run: |
          target/debug/rookhold dev >rookhold.log 2>&1 &
          echo $! > rookhold.pid
          for attempt in {1..100}; do
            curl -fsS http://127.0.0.1:7300/readyz >/dev/null && exit 0
            sleep .1
          done
          cat rookhold.log
          exit 1
      - name: Render the dashboard in the runner's stable Chrome
        shell: bash
        run: |
          google-chrome --version
          google-chrome --headless --no-sandbox --disable-gpu \
            --dump-dom http://127.0.0.1:7300 > "$RUNNER_TEMP/dashboard.html"
          grep -Fq '<title>Rookhold' "$RUNNER_TEMP/dashboard.html"
          grep -Fq 'id="primaryWorkspace"' "$RUNNER_TEMP/dashboard.html"
      - name: Stop local service
        if: always()
        shell: bash
        run: kill "$(cat rookhold.pid)" 2>/dev/null || true
