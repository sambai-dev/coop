name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  hostile:
    runs-on: ubuntu-latest
    container:
      image: rust:1-slim
      options: --privileged --cgroupns=host
    env:
      CARGO_HOME: /usr/local/cargo
      RUST_LOG: "info,coop_server=debug"
    steps:
      - name: install tooling and runtimes used by the suite
        run: |
          apt-get update -qq
          apt-get install -y -qq git python3 nodejs ca-certificates
          python3 --version && git --version
      - uses: actions/checkout@v4
      - name: show sandbox environment
        run: |
          id
          echo "--- /proc/self/cgroup ---"
          cat /proc/self/cgroup || true
          echo "--- cgroup.controllers ---"
          cat /sys/fs/cgroup/cgroup.controllers || true
          echo "--- cgroup.subtree_control ---"
          cat /sys/fs/cgroup/cgroup.subtree_control || true
          echo "--- writable check (mkdir + knob write) ---"
          mkdir -p /sys/fs/cgroup/coop-probe 2>/dev/null \
            && { echo max > /sys/fs/cgroup/coop-probe/memory.max 2>/dev/null && echo "knob write: OK" || echo "knob write: DENIED"; \
                 rmdir /sys/fs/cgroup/coop-probe; } \
            || echo "mkdir in cgroupfs: DENIED"
          mount | grep -i cgroup | head -5 || true
      - uses: Swatinem/rust-cache@v2
      - name: guard hostile test discovery >= 7
        run: |
          n=$(cargo test -p coop-server --test hostile -- --list --ignored | grep -c ': test$')
          echo "discovered ${n} hostile tests"
          if [ "${n}" -lt 7 ]; then
            echo "FAIL: expected >= 7 hostile tests, found ${n}"
            exit 1
          fi
      - name: run hostile-job containment suite
        run: cargo test -p coop-server --test hostile -- --ignored --nocapture
