name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  hostile:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: run hostile-job containment suite (needs root for namespaces + cgroups)
        run: >
          sudo -E env "PATH=$PATH" "RUSTUP_HOME=${RUSTUP_HOME:-/home/runner/.rustup}"
          "CARGO_HOME=${CARGO_HOME:-/home/runner/.cargo}"
          cargo test -p coop-server --test hostile -- --ignored --nocapture
