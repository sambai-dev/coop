[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "rookhold-sdk"
version = "0.7.1"
description = "Typed, dependency-free Python client for the Rookhold execution gateway"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rookhold contributors" }]
keywords = ["agents", "sandbox", "code-execution", "audit"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]
dependencies = []

[project.scripts]
rookhold-cli = "rookhold_cli:main"
rookhold-mcp = "rookhold_mcp:main"
coop-mcp = "coop_mcp:main"

[project.optional-dependencies]
dev = [
  "mypy==1.19.1; python_version < '3.10'",
  "mypy==2.3.1; python_version >= '3.10'",
  "pyright==1.1.411",
  "ruff==0.16.4",
]
stream = ["websocket-client>=1.6,<2"]

[project.urls]
Homepage = "https://github.com/sambai-dev/rookhold"
Repository = "https://github.com/sambai-dev/rookhold"
Issues = "https://github.com/sambai-dev/rookhold/issues"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"rookhold.py" = "rookhold/__init__.py"
"py.typed" = "rookhold/py.typed"
"rookhold_cli.py" = "rookhold_cli.py"
"coop.py" = "coop/__init__.py"
"coop_mcp.py" = "coop_mcp.py"
"rookhold_mcp.py" = "rookhold_mcp.py"
"coop.py.typed" = "coop/py.typed"

[tool.hatch.build.targets.sdist]
include = ["rookhold.py", "rookhold_cli.py", "rookhold_mcp.py", "coop.py", "coop_mcp.py", "py.typed", "coop.py.typed", "LICENSE", "README.md", "pyproject.toml", "tests"]

[tool.pyright]
pythonVersion = "3.9"
typeCheckingMode = "strict"
include = ["rookhold.py", "rookhold_cli.py", "rookhold_mcp.py", "coop.py", "coop_mcp.py", "tests/typecheck_usage.py"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
